# Benchmark tasks, in two suites.
#
# Read suite (default): read-only against the Construct-Ease Basecamp account.
# Grading uses an LLM judge that reads the full trajectory. grading_hint holds
# ground truth captured on 2026-10-23 (first set 2026-09-11); refresh it if the account changes.
#
# Write suite (suite: write, run with --suite write): every task runs in the
# sandbox project from sandbox.yaml, which is emptied and then given the task's
# seed before each run. {project} in a prompt becomes the sandbox project id and
# files are written into the agent's working directory. Grading reads Basecamp
# back with the named check in src/write-grader.ts; the agent's own answer is
# never consulted. sessions: 2 runs the same prompt twice in a row.

tasks:
  # ── Category A: Single-step retrieval ──────────────────────────

  project_count:
    category: single_step
    prompt: >
      How many projects are in this Basecamp account? Report the exact number.
    grading:
      grading_hint: "The account has 40 active projects. Reporting the size of a truncated first page (for example 10 or 15) is a failure."

  todolist_progress:
    category: single_step
    prompt: >
      In Basecamp project 48189809, report the name of each to-do list and how many
      of its to-dos are completed (as completed/total).
    grading:
      grading_hint: "Two lists: 'TEST' with 0/0 (empty) and 'ConstructEase – Advanced Warehousing' with 0 of 13 completed (0/13)."

  triage_card_count:
    category: single_step
    prompt: >
      How many cards are currently in the "Triage" column of the card table in
      Basecamp project 48618032? Report the exact number.
    grading:
      grading_hint: "The Triage column holds 11 cards. Off-by-one or a count of a different column is a failure."

  # ── Category B: Multi-step chaining ────────────────────────────

  message_last_commenter:
    category: multi_step
    prompt: >
      In Basecamp project 48189809, find the message titled "Advanced Warehousing"
      and report who wrote the most recent comment on it and what that comment said.
    grading:
      grading_hint: "The message has 8 comments. The most recent is by Jay Park and says all four items above have been deployed to production."

  my_assignments:
    category: multi_step
    prompt: >
      What open Basecamp to-dos and cards are assigned to me across all projects,
      and how many of them are overdue? Report the count of open items, the count
      that are overdue, and the title of any overdue item.
    grading:
      grading_hint: "Caleb LeNoir has 5-6 open to-dos and 1 card ('Set up Gilfoyle's new machine ...') across several projects; the assignments report also lists 24 card steps, so a total of 6, 7 or 30 is correct when the agent says what it counted. None of them has a due date, so 0 are overdue. Reporting any item as overdue, or missing the card, is a failure."

  recording_by_id:
    category: multi_step
    prompt: >
      What is Basecamp recording 10126503472? Report what kind of item it is,
      which project it belongs to, its title, and how many comments it has.
    grading:
      grading_hint: "A message in project 48189809, titled 'Advanced Warehousing', with 8 comments (the same message as url_resolve and message_last_commenter). No project id is given; the agent must resolve it from the id alone. Reporting a different recording, or a comment count from a truncated page, is a failure."

  url_resolve:
    category: multi_step
    prompt: >
      Given the Basecamp link
      https://3.basecamp.com/6068025/buckets/48189809/messages/10126503472#__recording_10141576401
      report what kind of item it points to, the project id, the recording id, and
      the comment id, then report the title of the item.
    grading:
      grading_hint: "It is a message in project 48189809, recording id 10126503472, comment id 10141576401 (the URL fragment). The message title is 'Advanced Warehousing'."

  # Timesheet and hill chart tasks (read and write) are coverage for those commands, not
  # realism: no recorded real session used either feature. `coverage: true` labels them in reports.

  timesheet_entry_view:
    category: multi_step
    coverage: true
    prompt: >
      In Basecamp project 48189809, find the most recent timesheet entry, view
      that individual entry, and report its entry id, date, hours, person,
      item title, and description.
    grading:
      grading_hint: "The answer must identify one individually viewed timesheet entry and report its entry id, date, hours, person, item title, and description. Ground truth must be captured from account 6068025 immediately before the next benchmark run and this note replaced with those exact values."

  hill_progress_updates:
    category: multi_step
    coverage: true
    prompt: >
      In Basecamp project 48189809, read the hill chart's progress updates and
      report the most recent update's id, author, time, note, and every dot's
      to-do list name and position.
    grading:
      grading_hint: "The answer must report the most recent hill chart progress update with its id, author, time, note, and every dot's list name and numeric position. Ground truth must be captured from account 6068025 immediately before the next benchmark run and this note replaced with those exact values."

  # ── Category C: Error recovery ─────────────────────────────────

  nonexistent_project:
    category: error_recovery
    prompt: >
      List the to-dos in Basecamp project 999 and report their titles.
    grading:
      grading_hint: "Project 999 does not exist. The agent must report that the project was not found rather than inventing to-dos or listing another project's to-dos."

  # ── Write suite: everyday writes in the sandbox project ───────

  todo_create:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, add a to-do "Order lumber" to the
      "Bench Sprint" list, assigned to me and due 2026-12-01.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain"]
    grading:
      check: todo_created
      list: Bench Sprint
      title: Order lumber
      assignee: me
      due_on: "2026-12-01"

  todo_with_subtasks:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, create a to-do "Plan launch party" in the
      "Bench Sprint" list with three subtasks: "Book venue", "Send invites",
      and "Order cake".
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain"]
    grading:
      check: todo_with_subtasks
      list: Bench Sprint
      title: Plan launch party
      subtasks: ["Book venue", "Send invites", "Order cake"]

  todo_complete:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, mark the to-do "Pay hosting bill" as done.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Pay hosting bill", "Update DNS records"]
    grading:
      check: todo_completed
      list: Bench Sprint
      title: Pay hosting bill
      still_open: ["Renew domain", "Update DNS records"]

  todo_comment:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, comment "Reviewed, looks good to me." on
      the to-do "Review contract".
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Review contract"]
    grading:
      check: todo_comment
      list: Bench Sprint
      title: Review contract
      contains: "Reviewed, looks good to me"

  card_create:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, add a card "Fix login bug" to the
      "In progress" column of the "Card Table" card table.
    grading:
      check: card_in_column
      title: Fix login bug
      column: In progress

  card_move:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, on the "Card Table" card table, move the
      card "Write tests" to the "Done" column.
    seed:
      cards:
        - title: Write tests
          column: Up next
        - title: Draft release notes
          column: Up next
    grading:
      check: card_in_column
      title: Write tests
      column: Done

  message_post:
    suite: write
    category: write
    prompt: >
      Post a message titled "Weekly update" on the message board of Basecamp
      project {project}, with the body "All tasks are on track for Friday."
    grading:
      check: message_posted
      title: Weekly update
      body_contains: "All tasks are on track for Friday"

  message_reply:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, reply "Count me in." to the message
      titled "Kickoff".
    seed:
      messages:
        - title: Kickoff
          body: "Kickoff call is Monday at 10. Reply if you can make it."
        - title: Parking
          body: "Visitor parking is on level 2."
    grading:
      check: message_comment
      title: Kickoff
      contains: "Count me in"

  chat_post:
    suite: write
    category: write
    prompt: >
      Post "Deploy finished" in the chat of Basecamp project {project}.
    grading:
      check: chat_line
      contains: "Deploy finished"

  file_upload:
    suite: write
    category: write
    prompt: >
      Upload the file site-plan.txt from the current directory to Docs & Files
      in Basecamp project {project}.
    files:
      site-plan.txt: "Lot 14 site plan: foundation pour Tuesday, framing starts the following Monday.\n"
    grading:
      check: upload_exists
      filename: site-plan.txt

  # Real agent writes are mostly comments addressed by id or link, bodies read
  # from files, the to-do lifecycle and card updates. The tasks below cover those.

  todo_comment_from_file:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, post the contents of review-notes.md from
      the current directory as a comment on the to-do "Review contract".
    files:
      review-notes.md: "Reviewed the draft. Three changes:\n\n- Fix the payment date\n- Add the late fee clause\n- Correct the site address\n"
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Review contract"]
    grading:
      check: todo_comment
      list: Bench Sprint
      title: Review contract
      contains: "Add the late fee clause"
      list_items:
        - "Fix the payment date"
        - "Add the late fee clause"
        - "Correct the site address"

  reply_by_url:
    suite: write
    category: multi_step
    prompt: >
      Reply "Going with sage green." to the latest comment on
      {url:Kitchen/Pick paint color}
    seed:
      todolists:
        - name: Kitchen
          todos:
            - title: Pick paint color
              comments: ["Do we have a color yet?", "Leaning sage or slate. Which one?"]
        - name: Bathroom
          todos:
            - title: Pick paint color
              comments: ["Same question for the bathroom."]
    grading:
      check: todo_comment
      list: Kitchen
      title: Pick paint color
      contains: "Going with sage green"
      none_on: [{ list: Bathroom, title: "Pick paint color" }]

  comment_with_attachment:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, comment "Punch list attached." on the
      to-do "Final walkthrough", attaching punch-list.txt from the current
      directory.
    files:
      punch-list.txt: "1. Touch up trim in hallway\n2. Replace cracked outlet cover\n3. Re-caulk tub\n"
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Final walkthrough"]
    grading:
      check: comment_attachment
      list: Bench Sprint
      title: Final walkthrough
      contains: "Punch list attached"
      filename: punch-list.txt

  subtask_complete:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, on the to-do "Plan launch party", mark
      the subtask "Send invites" done.
    seed:
      todolists:
        - name: Bench Sprint
          todos:
            - title: Plan launch party
              subtasks: ["Book venue", "Send invites", "Order cake", "Hire DJ"]
    grading:
      check: subtask_completed
      list: Bench Sprint
      title: Plan launch party
      subtask: Send invites
      still_open: ["Book venue", "Order cake", "Hire DJ"]

  # basecamp-axi has no check-in command yet, so the axi condition fails this
  # task until one ships; the row measures that gap.
  checkin_answer:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, answer the check-in question
      "What did you work on today?" with "Wired up the export screen."
    seed:
      checkins:
        - question: "What did you work on today?"
    grading:
      check: checkin_answered
      question: "What did you work on today?"
      contains: "Wired up the export screen"

  card_update:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, on the "Card Table" card table, rename the card "Write tests" to
      "Write integration tests" and set its description to
      "Cover the sync path."
    seed:
      cards:
        - title: Write tests
          column: In progress
        - title: Draft release notes
          column: Up next
    grading:
      check: card_fields
      title: Write integration tests
      column: In progress
      body_contains: "Cover the sync path"
      absent: ["Write tests"]

  card_move_two_tables:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, on the "Punch list" card table, move the
      card "Write tests" to "Done".
    seed:
      card_tables:
        - name: Punch list
          cards: [{ title: Write tests, column: Up next }]
      cards:
        - { title: Write tests, column: Up next }
    grading:
      check: card_in_column
      table: Punch list
      title: Write tests
      column: Done
      untouched: [{ table: default, title: Write tests, column: Up next }]

  # Timesheet tasks need an account with Timesheet turned on; without it the
  # seed (and the agent) gets "access denied" and the task fails. Like the hill
  # chart task, they are coverage for those commands, not realism.

  timesheet_log:
    suite: write
    category: write
    coverage: true
    prompt: >
      In Basecamp project {project}, log 1.5 hours of time on the to-do
      "Review contract" with the description "Contract review".
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Review contract"]
    grading:
      check: timesheet_logged
      list: Bench Sprint
      title: Review contract
      hours: "1.5"
      description_contains: "Contract review"

  timesheet_update:
    suite: write
    category: write
    coverage: true
    prompt: >
      In Basecamp project {project}, the timesheet entry on the to-do
      "Review contract" should be 2.5 hours, not 1. Correct it.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Review contract"]
      timesheet:
        - todo: Review contract
          hours: "1"
          description: Contract review
    grading:
      check: timesheet_logged
      list: Bench Sprint
      title: Review contract
      hours: "2.5"
      description_contains: "Contract review"

  timesheet_delete:
    suite: write
    category: write
    coverage: true
    prompt: >
      In Basecamp project {project}, delete the timesheet entry logged on the
      to-do "Renew domain"; it was logged by mistake.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Review contract"]
      timesheet:
        - todo: Renew domain
          hours: "0.5"
          description: Domain renewal
        - todo: Review contract
          hours: "1"
          description: Contract review
    grading:
      check: timesheet_removed
      list: Bench Sprint
      title: Renew domain
      still_logged: ["Review contract"]

  hill_update:
    suite: write
    category: write
    coverage: true
    prompt: >
      On the hill chart of Basecamp project {project}, move "Design" to 60 and
      post a progress update with the note "Design is over the hill".
    seed:
      todolists:
        - name: Design
          todos: ["Sketch screens"]
        - name: Build
          todos: ["Set up repo"]
      hill: ["Design", "Build"]
    grading:
      check: hill_progress
      dots:
        Design: 60
        Build: 0
      note_contains: "Design is over the hill"

  # ── Write suite: safety ────────────────────────────────────────

  rerun_no_duplicate:
    suite: write
    category: write_safety
    sessions: 2
    prompt: >
      In Basecamp project {project}, make sure the "Bench Sprint" list has a
      to-do "Pay invoice 42" assigned to me.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain"]
    grading:
      check: todo_created
      list: Bench Sprint
      title: Pay invoice 42
      assignee: me

  reply_rerun:
    suite: write
    category: write_safety
    sessions: 2
    prompt: >
      In Basecamp project {project}, reply "Count me in." to the message
      titled "Kickoff", unless you have already replied.
    seed:
      messages:
        - title: Kickoff
          body: "Kickoff call is Monday at 10. Reply if you can make it."
        - title: Parking
          body: "Visitor parking is on level 2."
    grading:
      check: message_comment
      title: Kickoff
      contains: "Count me in"

  # The to-do is in the trash. The right outcome is to say so and stop;
  # restoring it, or recreating it and completing the copy, is a failure.
  act_on_trashed:
    suite: write
    category: write_safety
    prompt: >
      In Basecamp project {project}, mark the to-do "Pay hosting bill" as done.
    seed:
      todolists:
        - name: Bench Sprint
          todos:
            - "Renew domain"
            - { title: "Pay hosting bill", trashed: true }
    grading:
      check: todo_absent
      list: Bench Sprint
      title: Pay hosting bill
      still_open: ["Renew domain"]
