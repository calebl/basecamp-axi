# Benchmark tasks, in two suites.
#
# Read suite (default): read-only against the Construct-Ease Basecamp account.
# Grading uses an LLM judge that reads the full trajectory. grading_hint holds
# ground truth captured on 2026-09-11; refresh it if the account changes.
#
# Write suite (suite: write, run with --suite write): every task runs in the
# sandbox project from sandbox.yaml, which is emptied and then given the task's
# seed before each run. {project} in a prompt becomes the sandbox project id and
# files are written into the agent's working directory. Grading reads Basecamp
# back with the named check in src/write-grader.ts; the agent's own answer is
# never consulted. sessions: 2 runs the same prompt twice in a row.

tasks:
  # ── Category A: Single-step retrieval ──────────────────────────

  project_count:
    category: single_step
    prompt: >
      How many projects are in this Basecamp account? Report the exact number.
    grading:
      grading_hint: "The account has 26 active projects. Reporting the size of a truncated first page (for example 10 or 15) is a failure."

  project_tools:
    category: single_step
    prompt: >
      Which Basecamp tools (to-dos, message board, chat, card table, docs, schedule, etc.)
      are enabled on project 48618032? List only the enabled ones.
    grading:
      grading_hint: "Enabled: Message Board, To-dos, Chat (Campfire), and Card Table (kanban board). Docs & Files, Schedule, Check-ins, and Email Forwards are disabled."

  people_on_project:
    category: single_step
    prompt: >
      Who are the people on Basecamp project 48618032? Report their names.
    grading:
      grading_hint: "Exactly two people: Caleb LeNoir and DevAI Bot."

  todolist_progress:
    category: single_step
    prompt: >
      In Basecamp project 48189809, report the name of each to-do list and how many
      of its to-dos are completed (as completed/total).
    grading:
      grading_hint: "One list: 'ConstructEase – Advanced Warehousing' with 0 of 12 completed (0/12)."

  triage_card_count:
    category: single_step
    prompt: >
      How many cards are currently in the "Triage" column of the card table in
      Basecamp project 48618032? Report the exact number.
    grading:
      grading_hint: "The Triage column holds 11 cards. Off-by-one or a count of a different column is a failure."

  # ── Category B: Multi-step chaining ────────────────────────────

  message_last_commenter:
    category: multi_step
    prompt: >
      In Basecamp project 48189809, find the message titled "Advanced Warehousing"
      and report who wrote the most recent comment on it and what that comment said.
    grading:
      grading_hint: "The message has 8 comments. The most recent is by Jay Park and says all four items above have been deployed to production."

  my_assignments:
    category: multi_step
    prompt: >
      What open Basecamp to-dos and cards are assigned to me across all projects,
      and how many of them are overdue? Report the count of open items, the count
      that are overdue, and the title of any overdue item.
    grading:
      grading_hint: "8 open items are assigned to Caleb LeNoir (3 cards, 5 to-dos). Exactly 1 is overdue: the card 'Install Date Match Group' in the Bugs project, due 2026-08-28. Reporting only to-dos and missing the cards, or only one project, is a failure."

  overdue_oldest:
    category: multi_step
    prompt: >
      Across all Basecamp projects, how many to-dos are overdue, and which one has
      the oldest due date? Report the count, the to-do title, and its due date.
    grading:
      grading_hint: "5 overdue to-dos. The oldest is 'Initial Concept Framework' in project KEP Multi Family, due 2025-12-22."

  url_resolve:
    category: multi_step
    prompt: >
      Given the Basecamp link
      https://3.basecamp.com/6068025/buckets/48189809/messages/10126503472#__recording_10141576401
      report what kind of item it points to, the project id, the recording id, and
      the comment id, then report the title of the item.
    grading:
      grading_hint: "It is a message in project 48189809, recording id 10126503472, comment id 10141576401 (the URL fragment). The message title is 'Advanced Warehousing'."

  # ── Category C: Error recovery ─────────────────────────────────

  nonexistent_project:
    category: error_recovery
    prompt: >
      List the to-dos in Basecamp project 999 and report their titles.
    grading:
      grading_hint: "Project 999 does not exist. The agent must report that the project was not found rather than inventing to-dos or listing another project's to-dos."

  # ── Write suite: everyday writes in the sandbox project ───────

  todo_create:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, add a to-do "Order lumber" to the
      "Bench Sprint" list, assigned to me and due 2026-12-01.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain"]
    grading:
      check: todo_created
      list: Bench Sprint
      title: Order lumber
      assignee: me
      due_on: "2026-12-01"

  todo_with_subtasks:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, create a to-do "Plan launch party" in the
      "Bench Sprint" list with three subtasks: "Book venue", "Send invites",
      and "Order cake".
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain"]
    grading:
      check: todo_with_subtasks
      list: Bench Sprint
      title: Plan launch party
      subtasks: ["Book venue", "Send invites", "Order cake"]

  todo_complete:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, mark the to-do "Pay hosting bill" as done.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Pay hosting bill", "Update DNS records"]
    grading:
      check: todo_completed
      list: Bench Sprint
      title: Pay hosting bill
      still_open: ["Renew domain", "Update DNS records"]

  todo_comment:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, comment "Reviewed, looks good to me." on
      the to-do "Review contract".
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain", "Review contract"]
    grading:
      check: todo_comment
      list: Bench Sprint
      title: Review contract
      contains: "Reviewed, looks good to me"

  card_create:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, add a card "Fix login bug" to the
      "In progress" column of the card table.
    grading:
      check: card_in_column
      title: Fix login bug
      column: In progress

  card_move:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, move the card "Write tests" to the
      "Done" column.
    seed:
      cards:
        - title: Write tests
          column: Up next
        - title: Draft release notes
          column: Up next
    grading:
      check: card_in_column
      title: Write tests
      column: Done

  message_post:
    suite: write
    category: write
    prompt: >
      Post a message titled "Weekly update" on the message board of Basecamp
      project {project}, with the body "All tasks are on track for Friday."
    grading:
      check: message_posted
      title: Weekly update
      body_contains: "All tasks are on track for Friday"

  message_reply:
    suite: write
    category: write
    prompt: >
      In Basecamp project {project}, reply "Count me in." to the message
      titled "Kickoff".
    seed:
      messages:
        - title: Kickoff
          body: "Kickoff call is Monday at 10. Reply if you can make it."
        - title: Parking
          body: "Visitor parking is on level 2."
    grading:
      check: message_comment
      title: Kickoff
      contains: "Count me in"

  chat_post:
    suite: write
    category: write
    prompt: >
      Post "Deploy finished" in the chat of Basecamp project {project}.
    grading:
      check: chat_line
      contains: "Deploy finished"

  file_upload:
    suite: write
    category: write
    prompt: >
      Upload the file site-plan.txt from the current directory to Docs & Files
      in Basecamp project {project}.
    files:
      site-plan.txt: "Lot 14 site plan: foundation pour Tuesday, framing starts the following Monday.\n"
    grading:
      check: upload_exists
      filename: site-plan.txt

  # ── Write suite: safety ────────────────────────────────────────

  rerun_no_duplicate:
    suite: write
    category: write_safety
    sessions: 2
    prompt: >
      In Basecamp project {project}, make sure the "Bench Sprint" list has a
      to-do "Pay invoice 42" assigned to me.
    seed:
      todolists:
        - name: Bench Sprint
          todos: ["Renew domain"]
    grading:
      check: todo_created
      list: Bench Sprint
      title: Pay invoice 42
      assignee: me
