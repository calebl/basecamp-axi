# Benchmark conditions — each defines how the agent accesses Basecamp.
# Both binaries are installed and authenticated against the same account. The
# agents_md text is appended to the system prompt and the allowed_tools list
# is the Bash permission allowlist, so each condition can only run its own binary
# plus read-only shell helpers.

conditions:
  cli:
    name: "basecamp CLI (raw)"
    tool: basecamp
    allowed_tools:
      - "Bash(basecamp:*)"
      - "Bash(which:*)"
      - "Bash(ls:*)"
      - "Bash(pwd:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(grep:*)"
      - "Bash(jq:*)"
      - "Bash(wc:*)"
      - "Bash(sort:*)"
      - "Bash(echo:*)"
      - "Bash(sed:*)"
      - "Bash(awk:*)"
      - "Bash(python3:*)"
    agents_md: |
      # Tools

      You have the `basecamp` CLI installed and authenticated. Use it for all
      Basecamp operations. Run `basecamp <command> --help` to discover
      subcommands and flags. Pass `--json` for machine-readable output.
      Most project-scoped commands take `--in <project id>`.

      Examples:
      - `basecamp projects list --json`
      - `basecamp todos list --in 48189809 --json`
      - `basecamp messages show 123 --json`

      Do not use `basecamp-axi`.

  axi:
    name: "basecamp-axi (AXI wrapper)"
    tool: basecamp-axi
    allowed_tools:
      - "Bash(basecamp-axi:*)"
      - "Bash(which:*)"
      - "Bash(ls:*)"
      - "Bash(pwd:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(grep:*)"
      - "Bash(jq:*)"
      - "Bash(wc:*)"
      - "Bash(sort:*)"
      - "Bash(echo:*)"
      - "Bash(sed:*)"
      - "Bash(awk:*)"
      - "Bash(python3:*)"
    agents_md: |
      # Tools

      You have `basecamp-axi` installed for Basecamp operations. The raw
      `basecamp` CLI is not available — use `basecamp-axi` for all Basecamp
      commands. Run `basecamp-axi` alone for a dashboard, or
      `basecamp-axi <command> --help` for usage. Most project-scoped
      commands take `--in <project id>` after the command.

      Examples:
      - `basecamp-axi project list`
      - `basecamp-axi todo list --in 48189809`
      - `basecamp-axi message view 123`
